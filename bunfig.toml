[install]
# Supply-chain cooldown: refuse package versions younger than 7 days.
# Mirrors uv's `exclude-newer` / Dependabot's `cooldown.default-days`.
# 7 days = 7 * 24 * 60 * 60 seconds.
minimumReleaseAge = 604800
# Scoped exception for the TanStack Table v9 port. `table-core` is an exact
# pin from `react-table`, so both must be listed for the resolution to
# complete. Remove both entries once the pinned version clears the cooldown.
minimumReleaseAgeExcludes = ["@tanstack/react-table", "@tanstack/table-core"]
